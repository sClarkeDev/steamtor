name: Deploying

on:
  push:
    branches:
      - main

env:
  FIREFOX_EXT_ID: ${{ vars.FIREFOX_EXT_ID }}

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm packages
        run: npm ci

      - name: Lint & type check
        run: npm run lint && npm run compile

      - name: Package for chrome
        run: npm run zip

      - name: Package for firefox
        run: npm run zip:firefox

      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Rename release assets
        run: |
          cp .output/steamtor-${{ steps.version.outputs.version }}-chrome.zip steamtor.chrome.zip
          cp .output/steamtor-${{ steps.version.outputs.version }}-firefox.zip steamtor.firefox.xpi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: |
            steamtor.chrome.zip
            steamtor.firefox.xpi
